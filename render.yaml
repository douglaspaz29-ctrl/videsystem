# =====================================================================
# VIDE — BLUEPRINT DE HOMOLOGAÇÃO RENDER.COM (AMBIENTE GRATUITO)
# Deploy de Testes: Backend dos 7 Agentes + PostgreSQL de Homologação
# =====================================================================

services:
  # 1. Backend dos 7 Agentes & Central de Comando (Homologação)
  - type: web
    name: vide-homologacao-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/status/infraestrutura
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: vide-homologacao-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true

databases:
  # 2. Banco de Dados PostgreSQL de Homologação (Gratuito)
  - name: vide-homologacao-db
    databaseName: vide_homologacao
    user: vide_admin
    region: oregon
    plan: free
