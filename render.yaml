# =====================================================================
# VIDE — BLUEPRINT OFICIAL RENDER.COM
# Deploy Automatizado: Backend dos 7 Agentes + PostgreSQL Gerenciado
# =====================================================================

services:
  # 1. Backend dos 7 Agentes & Central de Comando
  - type: web
    name: vide-operacao-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/status/infraestrutura
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: vide-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true

databases:
  # 2. Banco de Dados PostgreSQL Gerenciado
  - name: vide-postgres-db
    databaseName: vide_operacao
    user: vide_admin
    region: oregon
    plan: starter
